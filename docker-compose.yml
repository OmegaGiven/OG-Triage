services:
  postgres:
    image: postgres:16-alpine
    container_name: og_triage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: og_triage
      POSTGRES_PASSWORD: og_triage_dev_password
      POSTGRES_DB: og_triage
    ports:
      # Host port 5544 (non-default) to avoid colliding with any local Postgres on 5432.
      - "5544:5432"
    volumes:
      - og_triage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U og_triage -d og_triage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  og_triage_pgdata:
    # Pinned by explicit name so renaming/moving this project directory
    # never causes Compose to spin up a fresh, empty volume under a new
    # project namespace and orphan the existing demo data. POSTGRES_USER/DB
    # above only apply on first init of a fresh volume -- this volume is
    # already initialized and keeps its data regardless of those values.
    name: og_triage_pgdata
